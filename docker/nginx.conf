user www-data;
worker_processes auto;
error_log /proc/self/fd/2 warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  # Skip access logs for known AI crawlers (they are 403'd below).
  map $http_user_agent $bad_bot {
    default 0;
    ~*meta-externalagent 1;
    ~*meta-externalfetcher 1;
    ~*GPTBot 1;
    ~*ChatGPT-User 1;
    ~*Amazonbot 1;
    ~*Bytespider 1;
    ~*CCBot 1;
    ~*ClaudeBot 1;
    ~*Google-Extended 1;
    ~*Applebot-Extended 1;
    ~*PetalBot 1;
  }
  map $bad_bot $loggable {
    1 0;
    default 1;
  }
  access_log /proc/self/fd/1 main if=$loggable;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20M;
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    # Security: Prevent PHP execution in uploads directory
    location ~ ^/images/.*\.php$ { deny all; }
    # Security headers for uploads directory
    location /images/ {
      add_header X-Content-Type-Options "nosniff" always;
    }
    # Security headers for all pages
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for Cloud Run (reduces log noise)
    location = /health {
      access_log off;
      return 200 "OK";
      add_header Content-Type text/plain;
    }

    # Block known AI crawlers before PHP-FPM (safe use of if + return).
    if ($bad_bot) {
      return 403;
    }

    # Handle robots.txt case-insensitively (fixes 404 warnings)
    # MediaWiki generates robots.txt dynamically via Special:Robots
    location ~* ^/robots\.txt$ {
      access_log off;
      rewrite ^(.*)$ /index.php?title=Special:Robots last;
    }

    # Reduce logging for internal/health check requests
    location ~ ^/(health|favicon.ico) {
      access_log off;
    }

    # MediaWiki REST API (header search autocomplete, VisualEditor, etc.)
    # Must be before the pretty-URL catch-all or /rest.php/v1/... is rewritten
    # to index.php and returns HTML (404) instead of application/json.
    location ^~ /rest.php {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index rest.php;
      fastcgi_param SCRIPT_FILENAME $document_root/rest.php;
      include fastcgi_params;
      fastcgi_connect_timeout 10s;
      fastcgi_send_timeout 300s;
      fastcgi_read_timeout 300s;
      fastcgi_buffering off;
    }
    location / {
      try_files $uri $uri/ @mediawiki;
    }
    location @mediawiki {
      rewrite ^/(.*)$ /index.php?title=$1&$args last;
    }
    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      include fastcgi_params;
      fastcgi_connect_timeout 10s;
      fastcgi_send_timeout 300s;
      fastcgi_read_timeout 300s;
      fastcgi_buffering off;
    }
    location ~ /\. { deny all; }
  }
}
